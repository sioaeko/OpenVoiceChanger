name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-test.txt
          # CPU-only torch keeps the checkpoint-loading security tests running
          # without pulling a multi-gigabyte CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Byte-compile the backend
        run: python -m compileall -q backend

      - name: Run tests
        run: python -m pytest

  updater-windows:
    name: Updater (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest fastapi pydantic-settings httpx uvicorn
      - run: python -m pytest tests/test_updates.py tests/test_update_installer.py tests/test_runtime_setup.py

  runtime-windows:
    name: RVC setup (Windows, cold install)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi pydantic-settings uvicorn
      - name: Install from empty caches and verify supervised restart
        run: python -m scripts.verify_runtime_setup
      - name: Preserve setup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-setup-logs
          path: |
            tmp/runtime-cold-*/data/rvc-setup/state.json
            tmp/runtime-cold-*/data/rvc-setup/jobs/*/setup.log
          if-no-files-found: ignore
